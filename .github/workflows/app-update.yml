# Sends a JavaScript-only change straight to phones that already have a
# TestFlight build, in a couple of minutes, with no new build. Uses EAS Update
# (free plan) through EXPO_TOKEN.
#
# Only for changes to the app's own code (screens, logic, text). A change to
# native code (Swift, a new native package, app.json plugins) needs
# "iOS to TestFlight" instead: phones on an older build ignore updates that
# don't match their native code, so nothing breaks either way.
#
# Runs by itself whenever app code lands on main, so every merged change
# reaches phones with nobody pressing anything (Edem asked for this,
# 2026-11-08). It can still be run by hand from the Actions tab:
# "Update the app" > Run workflow. Close and reopen the app twice: it
# downloads on the first open and uses it on the next. runtimeVersion uses
# the fingerprint policy, so a native change never reaches an older build.
name: Update the app

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/app-update.yml"
  workflow_dispatch:
    inputs:
      message:
        description: "What changed (shown on expo.dev)"
        type: string
        default: "Update"

concurrency:
  group: app-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Build
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Same as the production build profile in eas.json.
      EXPO_PUBLIC_API_URL: https://feynman-voice-api.vercel.app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        working-directory: .
        run: npm ci

      # The Kitten voice model isn't in git (too big); the app bundle needs it,
      # just as the TestFlight build fetches it after install.
      - name: Fetch the Kitten voice model
        run: npm run fetch-model

      - name: Publish the update to the production channel
        env:
          # Typed in by hand, or the first line of the merged change when it runs by itself.
          MESSAGE: ${{ inputs.message || github.event.head_commit.message || 'Update' }}
        run: npx --yes eas-cli@latest update --channel production --environment production --platform ios --message "$(printf '%s' "$MESSAGE" | head -n 1)" --non-interactive
